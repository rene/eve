# Qualcomm IQ-8275 EVK GRUB settings, appended to grub-qcom.cfg in the ESP's
# /EFI/BOOT/grub-hv.cfg

# Monaco EVK device tree from the EVE kernel, EL2 variant: the board boots
# with xbl_config_kvm.elf (no Gunyah), so Linux runs at EL2 for KVM. Without
# it, the kernel uses the device tree from the UEFI firmware (dtb_a/dtb_b).
# Also, use the PCIe1-gen3 overlay to make it work with some NVMe devices
# that don't work reliably on Gen4 link
set_to_existing_file devicetree "/boot/dtb/qcom/monaco-evk-el2-pcie1-gen3.dtb"

# arm64.nopauth: pointer authentication must be disabled on QCS8300 for all
# cores to boot with KVM (same as meta-qcom's qcom-qcs8300.inc)
set_global dom0_platform_tweaks "net.ifnames=0 earlycon arm64.nopauth"
