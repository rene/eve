# Qualcomm IQ-9075 EVK GRUB settings, appended to grub-qcom.cfg in the ESP's
# /EFI/BOOT/grub-hv.cfg

# Lemans EVK device tree from the EVE kernel, EL2 variant: the board boots
# with xbl_config_kvm.elf (no Gunyah), so Linux runs at EL2 for KVM. Without
# it, the kernel uses the device tree from the UEFI firmware (dtb_a/dtb_b).
set_to_existing_file devicetree "/boot/dtb/qcom/lemans-evk-el2.dtb"

set_global dom0_platform_tweaks "pcie_pme=nomsi net.ifnames=0 pci=noaer pcie_aspm=off kpti=off kasan=off kasan.stacktrace=off swiotlb=128 earlycon reboot=panic page_owner=on qcom_scm.download_mode=1 nokaslr mitigations=auto rcupdate.rcu_expedited=1 rcu_nocbs=0-7 no-steal-acc vfio_iommu_type1.allow_unsafe_interrupts=1 fw_devlink.strict=1 vfio_platform.reset_required=0 amc6821.pwminv=1"
