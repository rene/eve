#
# EVE layout for LUN 0 (HLOS LUN) of Qualcomm UFS devices, in qcom-ptool
# format. At build time it replaces the LUN 0 entries of the board's
# partitions.conf from qcom-ptool; all other LUNs (boot firmware) are kept as
# provided by Qualcomm.
#
# Partition type and unique GUIDs, labels and sizes match the ones used by
# pkg/mkimage-raw-efi/make-raw, so storage-init, GRUB and zboot see the same
# layout as on any other EVE device:
#
#   EFI System  ESP-A, holds GRUB (efi.img). ESPs are found by their unique
#               GUID (GRUB, installer), labels are informative only
#   IMGA        rootfs A (rootfs.img). Attributes 0x0102000000000000 are GRUB
#               gptprio priority=2 (bit 49) + successful (bit 56), the same
#               bits make-raw sets with "sgdisk --attributes=N:set:49/56"
#   IMGB        rootfs B, empty until the first EVE update
#   CONFIG      config.img
#   EFI System B
#               reserved ESP-B, pre-formatted empty FAT (efi_b.img). make-raw
#               labels it "EFI System" too, but qcom-ptool rejects duplicate
#               names within a LUN
#   P3_PENDING  placeholder for /persist (see below). It's the last partition,
#               so qcom-ptool's --grow-last-partition (patch0.xml) makes it
#               span the rest of the LUN when flashing
#
# There is no P3 partition: /persist may live on another disk (e.g. NVMe), so
# storage-init decides on the first boot. While P3_PENDING exists, storage-init
# either replaces it with a P3 partition on the same space, or removes it when
# /persist is set up on other disk(s) (eve_persist_disk=). Once P3_PENDING is
# gone, storage-init never creates /persist on its own again.
#
# Unlike the firmware LUNs, there is no trailing zero-type "last_parti" entry:
# sgdisk treats such entries as used partitions, so the space they cover could
# not be allocated to P3 at runtime.
#
# Sizes are in KB. All partitions are writable (readonly=false).

--partition --lun=0 --name="EFI System" --size=2097152KB --type-guid=C12A7328-F81F-11D2-BA4B-00A0C93EC93B --uniqueguid=ad6871ee-31f9-4cf3-9e09-6f7a25c30051 --readonly=false --filename=efi.img
--partition --lun=0 --name=IMGA --size=10485760KB --type-guid=5DFBF5F4-2848-4BAC-AA5E-0D9A20B745A6 --uniqueguid=ad6871ee-31f9-4cf3-9e09-6f7a25c30052 --readonly=false --attributes=0x0102000000000000 --filename=rootfs.img
--partition --lun=0 --name=IMGB --size=10485760KB --type-guid=5DFBF5F4-2848-4BAC-AA5E-0D9A20B745A6 --uniqueguid=ad6871ee-31f9-4cf3-9e09-6f7a25c30053 --readonly=false
--partition --lun=0 --name=CONFIG --size=5120KB --type-guid=13307E62-CD9C-4920-8F9B-91B45828B798 --uniqueguid=ad6871ee-31f9-4cf3-9e09-6f7a25c30054 --readonly=false --filename=config.img
--partition --lun=0 --name="EFI System B" --size=2097152KB --type-guid=C12A7328-F81F-11D2-BA4B-00A0C93EC93B --uniqueguid=ad6871ee-31f9-4cf3-9e09-6f7a25c30056 --readonly=false --filename=efi_b.img
--partition --lun=0 --name=P3_PENDING --size=0KB --type-guid=8DA63339-0007-60C0-C436-083AC8230908 --uniqueguid=ad6871ee-31f9-4cf3-9e09-6f7a25c30063 --readonly=false
