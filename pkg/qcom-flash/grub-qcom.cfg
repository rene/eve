#
# Common GRUB settings for Qualcomm IQ devices.
#
# make-qcomflash writes this file, followed by the board's grub.cfg, to
# /EFI/BOOT/grub-hv.cfg in the ESP. EVE's rootfs.cfg (pkg/grub) sources it
# after its own platform detection and before CONFIG/grub.cfg, so it can
# override any of the output variables documented in rootfs.cfg (dom0_console,
# dom0_platform_tweaks, devicetree, ...), using set_global.
#
# Paths:
#   /boot/...        files of the running EVE rootfs (e.g. /boot/dtb/qcom/*.dtb)
#   ${esp_dev}/...   files of the ESP (e.g. ${esp_dev}/dtb/*.dtb from the board)
#
# A board can replace this file by providing its own grub-qcom.cfg.

# Qualcomm GENI serial console. The last console= is /dev/console (init and
# EVE output), so the serial port goes last, like EVE's default arm64 consoles
set_global dom0_console "console=tty0 console=ttyMSM0,115200"
