# Qualcomm IQ platform GRUB overrides (PLATFORM=qcom-iq9)
#
# This file is shipped by pkg/qti, so it is only present in rootfs/installer
# images built with PLATFORM=qcom-iq9. It is sourced by pkg/grub/rootfs.cfg
# (as /EFI/BOOT/grub-qti.cfg) after the generic arch/flavor settings and
# grub-hv.cfg, and before CONFIG/grub.cfg and the eve-kernel-extra-cmdline
# EFI variable, so both of those can still override anything set here.
#
# Like rootfs.cfg (/EFI/BOOT/grub.cfg), this file lives inside the rootfs
# image (IMGA/IMGB), NOT in the EFI System Partition, so it is updated and
# rolled back together with EVE. Only the eve-board file lives in the ESP.
#
# Qualcomm IQ8/IQ9 firmware does not provide SMBIOS information, so the board
# is identified by a board ID stored in a plain text file in the EFI System
# Partition (ESP):
#
#    <ESP>/eve-board    e.g. "qcs8275_iq_8275_evk"
#
# The file must contain only the board ID (a trailing newline is fine). Only
# the IDs listed in qcom_known_boards are accepted; each one maps to a
# qcom_board_<ID> function below that sets the device tree (taken from the
# rootfs, so it is always in sync with the kernel) and any board specific
# kernel command line options.
#
# NOTE: variable names can NOT be longer than 20 characters.

set qcom_known_boards='^(qcs8275_iq_8275_evk|qcs9075_iq_9075_evk)$'

# Settings common to all Qualcomm IQ boards
function qcom_common {
   set_global dom0_console "console=ttyMSM0,115200 console=tty0"
   set_global dom0_platform_tweaks "net.ifnames=0 earlycon"
}

# Qualcomm IQ-8275-EVK (IQ8)
function qcom_board_qcs8275_iq_8275_evk {
   qcom_common
   set_to_existing_file devicetree /boot/dtb/qcom/qcs8275-iq-8275-evk.dtb
   set_global dom0_platform_tweaks "$dom0_platform_tweaks arm64.nopauth"
}

# Qualcomm IQ-9075-EVK (IQ9)
function qcom_board_qcs9075_iq_9075_evk {
   qcom_common
   set_to_existing_file devicetree /boot/dtb/qcom/qcs9075-iq-9075-evk-el2.dtb
   set_global dom0_platform_tweaks "$dom0_platform_tweaks pcie_pme=nomsi pci=noaer pcie_aspm=off kpti=off kasan=off kasan.stacktrace=off swiotlb=128 reboot=panic page_owner=on qcom_scm.download_mode=1 nokaslr mitigations=auto rcupdate.rcu_expedited=1 rcu_nocbs=0-7 no-steal-acc vfio_iommu_type1.allow_unsafe_interrupts=1 fw_devlink.strict=1 vfio_platform.reset_required=0 amc6821.pwminv=1"
}

# Read the board ID from the ESP on the drive we booted from into qcom_board_id
function qcom_read_board_id {
   unset qcom_board_id
   set _qcom_dev="$cmddevice"
   if [ -z "$_qcom_dev" ]; then
      set _qcom_dev="$root"
   fi
   regexp --set _qcom_drive "^([^,]*,)gpt" "$_qcom_dev"
   if [ -z "$_qcom_drive" ]; then
      return
   fi
   # ESP partition GUIDs, see EFI_UUID and INSTALLER_EFI_UUID in
   # pkg/mkimage-raw-efi/make-raw (installed system and installer media)
   for _qcom_uuid in ad6871ee-31f9-4cf3-9e09-6f7a25c30051 ad6871ee-31f9-4cf3-9e09-6f7a25c30061; do
      unset _qcom_esp
      search.part_uuid $_qcom_uuid _qcom_esp "$_qcom_drive"
      if [ -n "$_qcom_esp" -a -f "($_qcom_esp)/eve-board" ]; then
         cat -s qcom_board_id "($_qcom_esp)/eve-board"
         return
      fi
   done
}

if [ "$grub_virt" = baremetal ]; then
   qcom_read_board_id
   if [ -n "$qcom_board_id" ]; then
      if regexp "$qcom_known_boards" "$qcom_board_id"; then
         echo "Qualcomm board: $qcom_board_id"
         qcom_board_${qcom_board_id}
      else
         echo "WARNING: unknown Qualcomm board ID '$qcom_board_id' in eve-board, using defaults"
         qcom_common
      fi
   else
      echo "WARNING: no eve-board file found in the ESP, using Qualcomm defaults"
      qcom_common
   fi
fi
